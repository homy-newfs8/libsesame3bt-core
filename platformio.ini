; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
build_src_flags =
	-Wformat=2 -Wconversion -Wtrampolines -Wimplicit-fallthrough -Wsuggest-override
lib_deps =
	symlink://.
build_flags =
	-Ib:/.config/
	-Wall -Wextra
	-DLIBSESAME3BTCORE_DEBUG=1

[env:arduino_2]
platform = espressif32 @ 6.10.0
build_flags =
	${env.build_flags}
	-std=gnu++17
build_unflags =
	${env.build_unflags}
	-std=gnu++11

[env:arduino_3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
build_flags =
	${env.build_flags}
	-DUSE_FRAMEWORK_MBEDTLS_CMAC
	-DLIBSESAME3BTCORE_DEBUG=1
	-DLIBSESAME3BT_DEBUG=1
custom_sdkconfig =
	CONFIG_BT_NIMBLE_MAX_CONNECTIONS=6
custom_component_remove =
    espressif/esp_hosted
    espressif/esp_wifi_remote
    espressif/esp-dsp
    espressif/esp32-camera
    espressif/libsodium
    espressif/esp-modbus
    espressif/qrcode
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/esp_rainmaker
    espressif/rmaker_common

[env:dev]
extends = env:arduino_3
board = m5stack-atoms3
; board = seeed_xiao_esp32c3
build_flags =
	${env:arduino_3.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
